[app]
name = "collabora"
version = "0.1.0"
description = "Collabora Online (CODE) backend — serves the in-browser office editor over WOPI; pair with a WOPI host like Nextcloud."

[runtime.container]
image = "Dockerfile"
port = 9980

[resources]
# LibreOffice document processes are RAM-hungry.  2 GB is enough for a few
# concurrent documents; bump higher for heavy use.
memory_mb = 2048
cpu_millicores = 2000

[routing]
# Collabora's WOPI surface is public by design: the WOPI host (Nextcloud,
# etc.) hits /hosting/discovery to learn what extensions are editable, the
# browser loads /browser/<ver>/cool.html as the iframe entry point, and
# documents proxy through /cool/<doc-url>/ws (WebSocket) and /cool/<doc-url>/.
# All of these have to be reachable without an OpenHost login cookie because
# end-users come in via the WOPI host's own auth, not OpenHost's.  Document
# permissions are checked WOPI-side, not OpenHost-side.
public_paths = [
  "/hosting/discovery",
  "/hosting/capabilities",
  "/browser/",
  "/cool/",
  "/lool/",
  "/favicon.ico",
  "/robots.txt",
]
health_check = "/hosting/capabilities"
