[app]
name = "collabora"
version = "0.2.0"
description = "Collabora Online (CODE) office suite with a built-in file manager — upload, edit, and save documents in your browser."

[runtime.container]
image = "Dockerfile"
port = 8080

[resources]
# LibreOffice document processes are RAM-hungry.  2 GB is enough for a few
# concurrent documents; bump higher for heavy use.
memory_mb = 2048
cpu_millicores = 2000

[data]
# Documents the user uploads/creates live here, plus a tiny sqlite index.
app_data = true
